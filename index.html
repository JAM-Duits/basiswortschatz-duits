<html lang="nl">
<meta charset="utf-8">
<title>Basiswortschatz Duits</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d3a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basiswortschatz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: één smalle kolom zoals een Karteikasten — kaart bovenop, knoppen eronder; inktblauw met een geel markeerstift-accent. */
  :root {
    --bg: #eef1f6; --card: #ffffff; --ink: #14213d; --muted: #5b6680; --line: #d7dde8;
    --brand: #1d3a6e; --brand-ink: #ffffff; --mark: #ffd84d; --mark-ink: #14213d;
    --good: #1f8a52; --good-bg: #e2f4ea; --bad: #c63a36; --bad-bg: #fbe6e5;
    --der: #2563c9; --die: #c63a36; --das: #1f8a52;
    --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --f-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1522; --card: #182133; --ink: #eaf0fb; --muted: #94a0b8; --line: #2a3650;
      --brand: #9cb8f0; --brand-ink: #0f1522; --mark: #f2cc3f; --mark-ink: #0f1522;
      --good: #4cc584; --good-bg: #16301f; --bad: #f2716c; --bad-bg: #3a1a1a;
      --der: #7aa8ff; --die: #ff8a85; --das: #5fd18f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1522; --card: #182133; --ink: #eaf0fb; --muted: #94a0b8; --line: #2a3650;
    --brand: #9cb8f0; --brand-ink: #0f1522; --mark: #f2cc3f; --mark-ink: #0f1522;
    --good: #4cc584; --good-bg: #16301f; --bad: #f2716c; --bad-bg: #3a1a1a;
    --der: #7aa8ff; --die: #ff8a85; --das: #5fd18f; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--f-body); font-size: 16px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px 32px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  h1, h2, .display { font-family: var(--f-display); text-wrap: balance; }

  /* kop */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--brand-ink);
    display: grid; place-items: center; font: 800 17px/1 var(--f-display); flex: none; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .pill { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 999px; white-space: nowrap; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats b { display: block; font: 800 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--muted); }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .field { display: grid; gap: 8px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 11px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; padding: 9px 4px; border-radius: 8px; font-size: 14px; font-weight: 700; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }

  .cats-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px 0; }
  .linkbtn { border: 0; background: none; color: var(--brand); font-weight: 700; font-size: 14px; padding: 4px; }
  .cats { display: grid; gap: 8px; }
  .cat { display: grid; grid-template-columns: 34px 1fr 26px; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; }
  .cat .ic { font-size: 22px; text-align: center; }
  .cat .nm { min-width: 0; font-weight: 700; }
  .cat .nm .sub { font-weight: 400; }
  .bar { height: 5px; background: var(--bg); border-radius: 9px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 9px; }
  .check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; }
  .cat.on { border-color: var(--brand); }
  .cat.on .check { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .group-label { margin: 8px 2px 0; }

  .big { width: 100%; border: 0; background: var(--brand); color: var(--brand-ink); font: 800 18px/1 var(--f-display);
    padding: 17px; border-radius: 13px; }
  .big:disabled { opacity: .45; cursor: default; }
  .ghost { width: 100%; border: 1px solid var(--line); background: var(--card); font-weight: 700; padding: 14px; border-radius: 13px; }
  .ghost:disabled { opacity: .5; cursor: default; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .foot { text-align: center; font-size: 13px; color: var(--muted); }
  .foot button { border: 0; background: none; color: var(--bad); text-decoration: underline; padding: 2px; font-size: 13px; }
  .confirm { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .confirm button { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 12px; font-weight: 700; text-decoration: none; color: var(--ink); }
  .confirm .danger { background: var(--bad); color: #fff; border-color: var(--bad); }

  /* quiz */
  .top { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; padding-top: 10px; }
  .x { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); font-size: 17px; }
  .prog { height: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--mark); transition: width .3s; }
  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; text-align: center;
    display: grid; gap: 10px; justify-items: center; min-height: 190px; align-content: center; }
  .tag { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
  .ask { font-size: 14px; color: var(--muted); }
  .ask mark { background: var(--mark); color: var(--mark-ink); padding: 1px 6px; border-radius: 5px; font-weight: 700; }
  .word { font: 800 30px/1.2 var(--f-display); overflow-wrap: anywhere; }
  .word.long { font-size: 22px; }
  .forms { font-size: 15px; color: var(--muted); }
  .speak { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; }
  .art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }

  .opts { display: grid; gap: 10px; }
  .opt { width: 100%; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 13px;
    padding: 14px 16px; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .opt.good { border-color: var(--good); background: var(--good-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim { opacity: .5; }

  .typebox { display: grid; gap: 10px; }
  .typebox input { width: 100%; border: 2px solid var(--line); background: var(--card); border-radius: 13px; padding: 14px 16px; font-size: 18px; }
  .typebox input:focus { border-color: var(--brand); outline: none; }
  .typebox input.good { border-color: var(--good); background: var(--good-bg); }
  .typebox input.bad { border-color: var(--bad); background: var(--bad-bg); }
  .keys { display: flex; gap: 8px; flex-wrap: wrap; }
  .keys button { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 17px; }
  .keys .grow { flex: 1; font-size: 15px; }

  .flipzone { display: grid; gap: 10px; }
  .fb { border-radius: 13px; padding: 13px 15px; font-size: 15px; }
  .fb.good { background: var(--good-bg); color: var(--ink); border: 1px solid var(--good); }
  .fb.bad { background: var(--bad-bg); color: var(--ink); border: 1px solid var(--bad); }
  .fb .ans { font-weight: 700; font-size: 17px; margin-top: 4px; }
  .fb .tip { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* resultaat */
  .score { text-align: center; padding: 26px 0 6px; display: grid; gap: 4px; }
  .score .num { font: 800 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; }
  .list li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
  .list li:first-child { border-top: 0; }
  .list .de { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .list .nl { color: var(--muted); font-size: 14px; grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .fm { color: var(--muted); font-size: 13px; grid-column: 1; }
  .list .sp { grid-row: 1 / span 3; grid-column: 2; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; width: 36px; height: 36px; }

  /* woordenlijst */
  .search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
  .chips button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .count { font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .prog i { transition: none; } }
</style>

<div class="wrap" id="app">

  <!-- START -->
  <section id="home" class="wrap">
    <div class="head">
      <div class="brand">
        <div class="logo" aria-hidden="true">DE</div>
        <div><h1>Basiswortschatz</h1><div class="sub">Duits · woorden en zinnen</div></div>
      </div>
      <span class="pill" id="streak">🔥 0 dagen</span>
    </div>

    <div class="panel">
      <div class="stats">
        <div><b id="sKnown">0</b><span>beheerst</span></div>
        <div><b id="sSeen">0</b><span>geoefend</span></div>
        <div><b id="sTotal">0</b><span>totaal</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="field">
        <p class="label">Manier van oefenen</p>
        <div class="seg" id="modeSeg">
          <button data-v="kies">Kiezen<small>meerkeuze</small></button>
          <button data-v="typ">Typen<small>zelf schrijven</small></button>
          <button data-v="kaart">Kaartjes<small>omdraaien</small></button>
        </div>
      </div>
      <div class="field">
        <p class="label">Richting</p>
        <div class="seg" id="dirSeg">
          <button data-v="de">🇩🇪 → 🇳🇱</button>
          <button data-v="nl">🇳🇱 → 🇩🇪</button>
          <button data-v="mix">Mix</button>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <p class="label">Wat</p>
          <div class="seg" id="kindSeg">
            <button data-v="alles">Alles</button>
            <button data-v="woord">Woorden</button>
            <button data-v="zin">Zinnen</button>
          </div>
        </div>
        <div class="field">
          <p class="label">Aantal</p>
          <div class="seg" id="lenSeg">
            <button data-v="10">10</button>
            <button data-v="20">20</button>
            <button data-v="40">40</button>
          </div>
        </div>
      </div>
    </div>

    <div class="cats-head">
      <p class="label">Hoofdstukken</p>
      <button class="linkbtn" id="allBtn">Alles aan</button>
    </div>
    <div class="cats" id="cats"></div>

    <button class="big" id="startBtn">Start oefenen</button>
    <div class="row2">
      <button class="ghost" id="weakBtn">Lastige woorden</button>
      <button class="ghost" id="listBtn">📖 Woordenlijst</button>
    </div>
    <div class="foot" id="foot">Je voortgang wordt op dit apparaat bewaard · <button id="resetBtn">wissen</button></div>
  </section>

  <!-- OEFENEN -->
  <section id="quiz" class="wrap" hidden>
    <div class="top">
      <button class="x" id="quitBtn" aria-label="Stoppen">✕</button>
      <div class="prog"><i id="progBar" style="width:0%"></i></div>
      <span class="pill" id="progTxt">1/10</span>
    </div>
    <div class="qcard">
      <div class="tag" id="qCat"></div>
      <div class="ask" id="qAsk"></div>
      <div class="word" id="qWord"></div>
      <div class="forms" id="qForms" hidden></div>
      <button class="speak" id="speakBtn">🔊 Uitspraak</button>
    </div>
    <div class="opts" id="opts"></div>
    <form class="typebox" id="typeBox" hidden autocomplete="off">
      <input id="typeIn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Typ je antwoord…">
      <div class="keys" id="keys">
        <button type="button">ä</button><button type="button">ö</button><button type="button">ü</button><button type="button">ß</button>
        <button type="submit" class="grow" id="checkBtn">Controleer</button>
      </div>
    </form>
    <div class="flipzone" id="flipZone" hidden>
      <button class="big" id="flipBtn" type="button">Draai om</button>
      <div class="row2" id="judge" hidden>
        <button class="ghost" id="noBtn" type="button">❌ Nog niet</button>
        <button class="ghost" id="yesBtn" type="button">✅ Wist ik</button>
      </div>
    </div>
    <div class="fb" id="fb" hidden></div>
    <button class="big" id="nextBtn" hidden>Volgende</button>
  </section>

  <!-- RESULTAAT -->
  <section id="result" class="wrap" hidden>
    <div class="score">
      <div id="rEmoji" style="font-size:44px"></div>
      <div class="num" id="rScore"></div>
      <div class="sub" id="rText"></div>
    </div>
    <div class="panel" id="rMistCard">
      <p class="label">Nog even oefenen</p>
      <ul class="list" id="rMist"></ul>
    </div>
    <button class="big" id="againBtn">Nog een ronde</button>
    <button class="ghost" id="homeBtn">Terug naar start</button>
  </section>

  <!-- WOORDENLIJST -->
  <section id="lijst" class="wrap" hidden>
    <div class="top">
      <button class="x" id="listBack" aria-label="Terug">←</button>
      <h2 style="margin:0;font-size:20px">Woordenlijst</h2>
      <span class="count" id="listCount"></span>
    </div>
    <input class="search" id="q" type="search" placeholder="Zoek in het Duits of Nederlands…">
    <div class="chips" id="chips"></div>
    <div class="panel"><ul class="list" id="listUl"></ul></div>
  </section>

</div>

(() => {
  // ---------- Opslag ----------

  // ---------- Start ----------

  function pick(list, n) {

  // ---------- Vraagtypes ----------

  }

  function finishQuestion(good, note, flip) {

    const it = q.it;
    const p = state.progress[it.id] || { box: -1, right: 0, wrong: 0 };
    if (good) { p.right++; p.box = Math.min(5, Math.max(0, p.box) + 1); correct++; }
    else { p.wrong++; p.box = 0; mistakes.push(it); if (navigator.vibrate) try { navigator.vibrate(60); } catch {} }

  $("nextBtn").onclick = next;
  $("quitBtn").onclick = () => { renderHome(); show("home"); };
  $("speakBtn").onclick = () => speak(q.prompt);

  // ---------- Uitspraak ----------
  // Eerst de opgenomen stem (audio/cN.js per hoofdstuk, pas geladen als dat hoofdstuk nodig is),
  // anders de voorleesstem van het apparaat.
  window.AUDIO = window.AUDIO || {};
  const sayKey = t => t.replace(/\(.*?\)/g, "").replace(/…|\.\.\./g, "").replace(/\s+/g, " ").trim();
  const loadedAudio = {};
  function loadAudio(ids) {
    ids.forEach(id => {
      if (loadedAudio[id]) return;
      loadedAudio[id] = true;
      const s = document.createElement("script");
      s.src = `audio/c${id}.js`;
      s.onerror = () => { loadedAudio[id] = false; s.remove(); };
      document.head.appendChild(s);
    });
  }
  const player = new Audio();
  function bestVoice() {
    if (!("speechSynthesis" in window)) return null;
    const de = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("de"));
    const score = v => (/premium|enhanced|verbessert|natural|neural|online/i.test(v.name) ? 10 : 0)
      + (/google/i.test(v.name) ? 6 : 0) + (/anna|helena|petra|markus|yannick/i.test(v.name) ? 3 : 0) + (v.lang === "de-DE" ? 1 : 0);
    return de.sort((a, b) => score(b) - score(a))[0];
  }
  function speak(text) {
    const clean = sayKey(text);
    const clip = window.AUDIO[clean];
    if (clip) {
      try { if ("speechSynthesis" in window && speechSynthesis.speaking) speechSynthesis.cancel(); } catch {}
      player.pause(); player.src = clip; player.currentTime = 0;
      const p = player.play(); if (p) p.catch(() => {});
      return;
    }
    if (!("speechSynthesis" in window)) return;
    try {
      // cancel() vlak voor speak() laat sommige browsers stilvallen; alleen als er nog iets loopt
      if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "de-DE"; u.rate = 0.9;
      const v = bestVoice(); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch {}
  }

  // ---------- Resultaat ----------
  const itemRow = (m, withSpeak = true) => `<li><div class="de">${colorArt(m.de)}</div><div class="nl">${esc(m.nl)}</div>`
    + (m.imp ? `<div class="fm">${esc(formsOf(m))}</div>` : "")
    + (withSpeak ? `<button class="sp" data-say="${esc(m.de)}" aria-label="Uitspraak">🔊</button>` : "") + `</li>`;
  document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });

  function finish() {
    $("progBar").style.width = "100%";
    const pct = correct / round.length;
    $("rScore").textContent = `${correct} / ${round.length}`;
    $("rEmoji").textContent = pct === 1 ? "🏆" : pct >= .8 ? "🎉" : pct >= .5 ? "💪" : "📚";
    $("rText").textContent = pct === 1 ? "Perfekt! Alles goed." : pct >= .8 ? "Sehr gut!" : pct >= .5 ? "Gut gemacht. Blijf oefenen!" : "Herhaling helpt. Probeer het nog eens!";
    const uniq = [...new Map(mistakes.map(m => [m.id, m])).values()];
    $("rMist").innerHTML = uniq.map(m => itemRow(m)).join("");
    $("rMistCard").hidden = !uniq.length;
    show("result");
  }
  $("againBtn").onclick = () => start(lastWeak && items.some(isWeak));
  $("homeBtn").onclick = () => { renderHome(); show("home"); };
  $("startBtn").onclick = () => start(false);
  $("weakBtn").onclick = () => start(true);

  // ---------- Woordenlijst ----------
  let listCat = 1;
  function renderList() {
    $("chips").innerHTML = DATA.map(c => `<button data-c="${c.id}" class="${c.id === listCat ? "on" : ""}">${c.icon} ${c.id}. ${esc(c.title)}</button>`).join("");
    const term = fold($("q").value);
    const rows = term ? items.filter(i => fold(i.de + " " + i.nl + " " + (i.imp || "") + " " + (i.pp || "")).includes(term)) : items.filter(i => i.cat === listCat);
    $("chips").style.opacity = term ? .45 : 1;
    loadAudio(term ? [...new Set(rows.slice(0, 400).map(r => r.cat))] : [listCat]);
    $("listCount").textContent = `${rows.length} ${rows.length === 1 ? "item" : "items"}`;
    $("listUl").innerHTML = rows.slice(0, 400).map(m => itemRow(m)).join("") || `<li><div class="nl">Niets gevonden voor “${esc($("q").value)}”.</div></li>`;
  }
  $("chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; listCat = +b.dataset.c; $("q").value = ""; renderList(); b.scrollIntoView({ inline: "center", block: "nearest" }); };
  $("q").oninput = renderList;
  $("listBtn").onclick = () => { listCat = state.cats[0] || 1; renderList(); show("lijst"); };
  $("listBack").onclick = () => { renderHome(); show("home"); };

  if ("speechSynthesis" in window) speechSynthesis.getVoices();
  renderHome();
})();
</script>

</html>
